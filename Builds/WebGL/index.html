<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | xunyi</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    /* 9:16 竖屏：以 JS 计算为主，这里只是首帧兜底 */
    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    #unity-container { position: fixed !important; left: 50% !important; top: 50% !important;
                       transform: translate(-50%, -50%) !important; }
    #unity-canvas { width: 100% !important; height: 100% !important; display: block; }
    #unity-footer { position: relative; z-index: 10; }
    #fatal-overlay {
      display: none; position: fixed; inset: 0; z-index: 9999;
      background: #111; color: #eee; padding: 24px; box-sizing: border-box;
      font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: auto; white-space: pre-wrap; word-break: break-word;
    }
    #fatal-overlay h2 { color: #ff6b6b; font-size: 18px; margin: 0 0 12px; }
    #fatal-overlay .hint { color: #9ad; margin-top: 16px; }
  </style>
  </head>
  <body>
    <div id="fatal-overlay"><h2 id="fatal-title">启动失败</h2><div id="fatal-body"></div>
      <div class="hint">请把上面这段文字截图或复制发给开发者。</div></div>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1080 height=1920 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">xunyi · 9:16 · v3</div>
      </div>
    </div>
    <script>

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      // ——— 9:16 竖屏强制布局（JS 计算，不依赖 CSS calc / 媒体查询）———
      function layoutPortrait() {
        var vw = window.innerWidth || document.documentElement.clientWidth;
        var vh = window.innerHeight || document.documentElement.clientHeight;
        var w = Math.min(vw, vh * 9 / 16);
        var h = w * 16 / 9;
        container.style.position = 'fixed';
        container.style.left = '50%';
        container.style.top = '50%';
        container.style.transform = 'translate(-50%, -50%)';
        container.style.width = w + 'px';
        container.style.height = h + 'px';
        container.style.maxWidth = 'none';
        container.style.maxHeight = 'none';
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        // 让 Unity 按新尺寸重建渲染缓冲
        if (typeof canvasResize === 'function') canvasResize();
      }
      window.addEventListener('resize', layoutPortrait);
      window.addEventListener('orientationchange', layoutPortrait);
      layoutPortrait();

      // ——— 黑屏自诊断：任何启动/运行错误都显示在页面上 ———
      function showFatal(title, detail) {
        var overlay = document.getElementById('fatal-overlay');
        if (!overlay) { alert(title + "\n" + detail); return; }
        document.getElementById('fatal-title').textContent = title;
        document.getElementById('fatal-body').textContent = String(detail === undefined ? '' : detail);
        overlay.style.display = 'block';
        if (loadingBar) loadingBar.style.display = 'none';
      }

      window.addEventListener('error', function (e) {
        showFatal('运行错误（Runtime Error）',
          (e.message || (e.error && e.error.message) || '未知错误') +
          (e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        showFatal('异步错误（Unhandled Rejection）',
          (r && (r.message || r.stack)) || String(r));
      });

      // WebGL 2.0 能力检测（iOS < 15 会在这里失败）
      (function checkWebGL2() {
        var supported = false;
        try {
          var probe = document.createElement('canvas');
          supported = !!(probe.getContext('webgl2') || probe.getContext('experimental-webgl2'));
        } catch (err) { supported = false; }
        if (!supported) {
          showFatal('浏览器不支持 WebGL 2.0',
            '当前浏览器无法创建 WebGL 2.0 上下文，游戏无法运行。\n\n' +
            '· iOS：请升级到 15.0 或更高版本\n' +
            '· 鸿蒙：请用系统浏览器最新版，或安装 Chrome / Edge\n' +
            '· 部分浏览器需在设置中开启「硬件加速」');
        }
      })();

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        dataUrl: buildUrl + "/WebGL.data",
        frameworkUrl: buildUrl + "/WebGL.framework.js",
        codeUrl: buildUrl + "/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "xunyi",
        productVersion: "0.1",
        showBanner: unityShowBanner,
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop: 保持 layoutPortrait() 计算的 9:16 尺寸，不再写死 960x600
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                loadingBar.style.display = "none";
                fullscreenButton.onclick = () => {
                  unityInstance.SetFullscreen(1);
                };
              }).catch((message) => {
                showFatal("游戏启动失败", message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
