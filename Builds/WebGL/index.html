<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>寻遗 · 大雁塔</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0b0d; overflow: hidden; color: #eee;
               font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #unity-container { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
                     width: 100vw; height: 100vh; background: #0b0b0d; }
  #unity-canvas { width: 100%; height: 100%; display: block; background: #0b0b0d; }

  #boot { position: absolute; inset: 0; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 18px; z-index: 20; background: #0b0b0d; }
  #boot .title { font-size: 20px; letter-spacing: 6px; color: #d9c39a; }
  #boot .bar { width: 62%; max-width: 320px; height: 6px; border-radius: 3px; background: #2a2a2e; overflow: hidden; }
  #boot .fill { width: 0%; height: 100%; background: linear-gradient(90deg, #8b0001, #d9a441); transition: width .2s; }
  #boot .pct { font-size: 13px; color: #9a9a9a; }
  #boot .tip { font-size: 12px; color: #6c6c6c; max-width: 78%; text-align: center; line-height: 1.7; }

  #fatal { display: none; position: fixed; inset: 0; z-index: 99; background: #111; padding: 22px;
           box-sizing: border-box; overflow: auto; white-space: pre-wrap; word-break: break-word; }
  #fatal h2 { color: #ff6b6b; font-size: 17px; margin: 0 0 10px; }
  #fatal .hint { color: #8ab; margin-top: 14px; font-size: 13px; }
</style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width="1080" height="1920" tabindex="-1"></canvas>
    <div id="boot">
      <div class="title">寻 遗</div>
      <div class="bar"><div class="fill" id="boot-fill"></div></div>
      <div class="pct" id="boot-pct">正在加载 0%</div>
      <div class="tip" id="boot-tip">首次加载需要下载约 18 MB，请稍候</div>
    </div>
  </div>
  <div id="fatal"><h2 id="fatal-title">启动失败</h2><div id="fatal-body"></div>
    <div class="hint">请把上面这段文字截图发给开发者。</div></div>

<script>
  var container = document.getElementById('unity-container');
  var canvas    = document.getElementById('unity-canvas');
  var boot      = document.getElementById('boot');
  var fill      = document.getElementById('boot-fill');
  var pctText   = document.getElementById('boot-pct');
  var tipText   = document.getElementById('boot-tip');

  function layoutPortrait() {
    var vw = window.innerWidth || document.documentElement.clientWidth;
    var vh = window.innerHeight || document.documentElement.clientHeight;
    var w = Math.min(vw, vh * 9 / 16);
    var h = w * 16 / 9;
    container.style.width = w + 'px';
    container.style.height = h + 'px';
    canvas.style.width = '100%';
    canvas.style.height = '100%';
  }
  window.addEventListener('resize', layoutPortrait);
  window.addEventListener('orientationchange', layoutPortrait);
  layoutPortrait();

  function showFatal(title, detail) {
    if (boot) boot.style.display = 'none';
    document.getElementById('fatal-title').textContent = title;
    document.getElementById('fatal-body').textContent = String(detail === undefined ? '' : detail);
    document.getElementById('fatal').style.display = 'block';
  }

  window.addEventListener('error', function (e) {
    showFatal('运行错误', (e.message || '') + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    showFatal('异步错误', (r && (r.message || r.stack)) || String(r));
  });

  var gl2ok = false;
  try { gl2ok = !!document.createElement('canvas').getContext('webgl2'); } catch (err) {}
  if (!gl2ok) {
    showFatal('浏览器不支持 WebGL 2.0',
      '当前浏览器无法创建 WebGL 2.0 上下文。\n\n' +
      '· iOS 请升级到 15.0+\n· 鸿蒙请用系统浏览器最新版或 Chrome\n' +
      '· 微信内请点右上角「…」→「在浏览器中打开」');
  }

  // 资源基地址：构建后由脚本替换为 jsDelivr 地址（比 GitHub Pages 快约 10 倍）
  var buildBase = "__BUILD_BASE__";
  var buildUrl  = buildBase + "/Build";
  var loaderUrl = buildUrl + "/WebGL.loader.js";
  var config = {
    dataUrl:      buildUrl + "/WebGL.data",
    frameworkUrl: buildUrl + "/WebGL.framework.js",
    codeUrl:      buildUrl + "/WebGL.wasm",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "xunyi",
    productName: "xunyi",
    productVersion: "1.0",
    showBanner: function (msg, type) {
      if (type === 'error') showFatal('运行错误', msg);
      else console.warn(msg);
    }
  };

  var startedAt = Date.now();
  var lastPct = 0;
  setInterval(function () {
    if (!boot || boot.style.display === 'none') return;
    var wait = Math.round((Date.now() - startedAt) / 1000);
    if (lastPct > 0) pctText.textContent = '正在加载 ' + Math.round(lastPct * 100) + '%  ·  ' + wait + ' 秒';
    else pctText.textContent = '正在加载… ' + wait + ' 秒';
  }, 500);

  var script = document.createElement('script');
  script.src = loaderUrl;
  script.onerror = function () {
    showFatal('加载器下载失败', '无法获取：\n' + loaderUrl + '\n请检查网络后重试。');
  };
  script.onload = function () {
    createUnityInstance(canvas, config, function (progress) {
      lastPct = progress;
      fill.style.width = Math.round(progress * 100) + '%';
      pctText.textContent = '正在加载 ' + Math.round(progress * 100) + '%';
      if (progress > 0.9) tipText.textContent = '正在初始化引擎…';
    }).then(function (unityInstance) {
      boot.style.display = 'none';
      window.__xunyi = unityInstance;
    }).catch(function (message) {
      showFatal('游戏启动失败', message);
    });
  };
  document.body.appendChild(script);
</script>
</body>
</html>
